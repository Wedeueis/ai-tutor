[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wedeueis Braz", email = "wedeueisbraz@yahoo.com.br" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "docling==2.118.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=2.0.0",
    "pyyaml>=6.0.3",
    "torch>=2.4",
    "torchvision>=0.28.0",
    "typer<0.27.0",
]

[project.scripts]
pipeline = "pipeline.cli.main:app"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
    "pytest>=9.1.1",
]
