[project]
name = "pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wedeueis Braz", email = "wedeueisbraz@yahoo.com.br" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "docling==2.118.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=2.0.0",
    # Read source-document credibility signals (§5.1 author / last_modified),
    # which Docling itself does not expose. All four already arrive as Docling
    # transitives; declared here because `adapters/docling/source_metadata.py`
    # imports them directly and a Docling upgrade could drop any of them.
    "openpyxl>=3.1",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-dotenv>=1.2.2",
    "python-pptx>=1.0",
    "pyyaml>=6.0.3",
    "torch>=2.4",
    "torchvision>=0.28.0",
    "typer<0.27.0",
]

[project.scripts]
pipeline = "pipeline.cli.main:app"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
    "mypy>=1.14",
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Also registered in tests/conftest.py, which additionally uses the marker to
# skip when Ollama is unreachable. Declared here so `--strict-markers` and
# `-m integration` work without importing conftest.
markers = [
    "integration: needs a real local service (e.g. Ollama) running",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/pipeline"]

[tool.mypy]
files = ["src/pipeline"]
python_version = "3.12"
# The domain and application layers are the ones NFR7 cares about and the ones
# with no third-party types to fight; adapters wrap libraries that ship
# partial or absent stubs, so the strict settings are scoped rather than global.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pipeline.domain.*", "pipeline.application.*"]
disallow_untyped_defs = true

# Third-party packages without bundled type information.
[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "docling.*",
    "docx.*",
    "fpdf.*",
    "jsonschema.*",
    "openpyxl.*",
    "pptx.*",
    "pypdfium2.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is a soft target here, not a hard gate
    "UP042", # `class X(str, Enum)` -> `StrEnum` is a behavior-adjacent rewrite, not a safe mechanical fix
]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]
