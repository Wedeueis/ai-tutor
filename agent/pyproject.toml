[project]
name = "agent"
version = "0.1.0"
description = "Knowledge Retrieval Agent: an ADK-based conversational agent that reads the OKF vault via pipeline's MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.0.0",
    "litellm>=1.0.0",
    "mcp>=1.9.0,<2.0.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = false
