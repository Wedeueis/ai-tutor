name: pipeline CI

on:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: pipeline

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test
        # Ollama isn't available in CI — tests marked `@pytest.mark.integration`
        # auto-skip when it's unreachable (see tests/conftest.py and
        # docs/reference/testing.md). Everything else (domain, application
        # against fakes, filesystem/SQLite/ChromaDB/Docling adapters) still runs.
        run: uv run pytest -q
